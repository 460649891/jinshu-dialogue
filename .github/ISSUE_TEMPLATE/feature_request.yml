name: Feature request / 功能建议
description: 描述希望改善的使用场景
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 当前遇到的问题
      description: 说明使用场景和希望达成的结果，不需要先设计实现。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议与替代方法
      description: 可补充想法、可接受的取舍，或现在的处理方式。
  - type: markdown
    attributes:
      value: 请勿上传游戏文件、存档、私人对白或含个人路径的截图。新版本适配请提供版本与主程序 SHA-256。
